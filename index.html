<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapsul Waktu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #030712;
            --card-glass: rgba(15, 23, 42, 0.45);
            --card-border: rgba(255, 255, 255, 0.06);
            --purple-glow: #c084fc;
            --purple-gradient: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding-bottom: 100px;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            letter-spacing: -0.2px;
        }

        /* CANVAS BACKGROUND */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* NAVBAR ELEGAN */
        .navbar {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background-color: rgba(3, 7, 18, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .brand-title { 
            font-weight: 700; 
            font-size: 16px; 
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
            opacity: 0.9;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* HERO SECTION */
        .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 2; }
        .hero-section { text-align: center; margin: 80px 0 60px 0; }
        
        .badge-info {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.25);
            color: var(--purple-glow);
            padding: 6px 16px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 100px;
            margin-bottom: 24px;
        }

        .main-title { 
            font-size: 52px; 
            font-weight: 800; 
            letter-spacing: -2px; 
            margin-bottom: 16px; 
            background: linear-gradient(to bottom, #ffffff 60%, #9ca3af 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        
        .subtitle { 
            font-size: 16px; 
            color: var(--text-muted); 
            margin-bottom: 40px; 
            font-weight: 400; 
            line-height: 1.6;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        /* BUTTON PREMIUM */
        .btn-tambah-momen {
            background: #ffffff;
            color: #030712;
            border: none;
            padding: 16px 36px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-tambah-momen:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 255, 255, 0.3);
            background: #f3f4f6;
        }

        /* GRID KARTU KAPSUL WAKTU */
        .grid-memori { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 32px; }
        
        .card-memori { 
            background: var(--card-glass); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px; 
            overflow: hidden; 
            border: 1px solid var(--card-border); 
            display: flex; 
            flex-direction: column; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-memori:hover {
            transform: translateY(-6px);
            border-color: rgba(168, 85, 247, 0.3);
            background: rgba(20, 30, 55, 0.6);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(168, 85, 247, 0.05);
        }
        
        .image-wrapper { width: 100%; height: 260px; overflow: hidden; position: relative; background: #0b0f19; }
        .card-memori img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-memori:hover img { transform: scale(1.04); }

        .card-content { padding: 28px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-date { font-size: 11px; font-weight: 700; color: var(--purple-glow); letter-spacing: 1px; margin-bottom: 14px; text-transform: uppercase; }
        .card-content h3 { margin: 0 0 12px 0; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.3; color: #ffffff; }
        .card-content p { margin: 0 0 28px 0; color: var(--text-muted); font-size: 14px; line-height: 1.6; flex-grow: 1; font-weight: 400; }
        
        .btn-hapus { background: transparent; color: #f87171; border: 1px solid rgba(248, 113, 113, 0.2); padding: 12px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 13px; width: 100%; transition: 0.2s; }
        .btn-hapus:hover { background: rgba(248, 113, 113, 0.1); border-color: #f87171; }

        /* MODAL POPUP CLEAN & FRESH */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(3, 7, 18, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.08); padding: 36px; border-radius: 28px; width: 90%; max-width: 440px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); }
        .modal-content h3 { margin-top: 0; margin-bottom: 24px; font-size: 22px; font-weight: 700; text-align: center; letter-spacing: -0.5px; }
        
        .modal-content input, .modal-content textarea { width: 100%; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); color: white; padding: 16px; border-radius: 14px; margin-bottom: 20px; font-size: 14px; font-family: inherit; box-sizing: border-box; transition: 0.2s; }
        .modal-content input:focus, .modal-content textarea:focus { outline: none; border-color: var(--purple-glow); background: rgba(255, 255, 255, 0.06); }
        
        .file-label { display: block; background: rgba(255, 255, 255, 0.02); border: 1px dashed rgba(255, 255, 255, 0.15); padding: 18px; text-align: center; border-radius: 14px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--text-main); margin-bottom: 20px; transition: 0.2s; }
        .file-label:hover { background: rgba(168, 85, 247, 0.05); border-color: var(--purple-glow); }
        input[type="file"] { display: none; }
        
        #preview-container img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 14px; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .modal-buttons { display: flex; gap: 12px; }
        .btn-save { background: #ffffff; color: #030712; border: none; padding: 15px; border-radius: 14px; flex: 2; font-weight: 700; font-size: 14px; cursor: pointer; }
        .btn-save:hover { background: #f3f4f6; }
        .btn-cancel { background: transparent; color: var(--text-muted); border: 1px solid rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 14px; flex: 1; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .btn-cancel:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <header class="navbar">
        <div class="brand-title">🌌 Kapsul Waktu</div>
    </header>

    <div class="container">
        <div class="hero-section">
            <div id="counter-momen" class="badge-info">🔮 Menghubungkan...</div>
            <h1 class="main-title">Kapsul Waktu</h1>
            <p class="subtitle">Simpan dan amankan lembaran foto kenangan indahmu ke dalam ruang digital abadi.</p>
            <button id="btn-buka-modal" class="btn-tambah-momen">
                <span>✨ Kunci Momen Baru</span>
            </button>
        </div>
        <div id="daftar-memori" class="grid-memori"></div>
    </div>

    <div id="modal-input" class="modal hidden">
        <div class="modal-content">
            <h3>🔒 Kunci Momen Baru</h3>
            <input type="text" id="judul" placeholder="Judul Momen Spesial...">
            <textarea id="cerita" rows="3" placeholder="Tulis cerita atau deskripsi kenangan ini..."></textarea>
            
            <label class="file-label">
                📸 Pilih Foto Kenangan
                <input type="file" id="foto" accept="image/*">
            </label>
            
            <div id="preview-container" class="hidden">
                <img id="preview-foto" src="" alt="Pratinjau">
            </div>

            <div class="modal-buttons">
                <button id="btn-simpan" class="btn-save">Simpan Kenangan</button>
                <button id="btn-batal" class="btn-cancel">Batal</button>
            </div>
        </div>
    </div>

    <script>
        // BACKGROUND PARTICLES LOGIC
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let partikelArray = [];

        function aturUkuranCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        aturUkuranCanvas();
        window.addEventListener('resize', aturUkuranCanvas);

        class Partikel {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.ukuran = Math.random() * 1.5 + 0.5;
                this.kecepatanY = Math.random() * 0.2 + 0.05; // Lebih pelan & elegan
                this.kecepatanX = Math.random() * 0.06 - 0.03;
                this.alpha = Math.random() * 0.4 + 0.1;
            }
            update() {
                this.y += this.kecepatanY;
                this.x += this.kecepatanX;
                if (this.y > canvas.height) {
                    this.y = 0;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.fillStyle = `rgba(192, 132, 252, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.ukuran, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function inisialisasiPartikel() {
            partikelArray = [];
            const jumlahPartikel = Math.min(50, window.innerWidth / 15);
            for (let i = 0; i < jumlahPartikel; i++) {
                partikelArray.push(new Partikel());
            }
        }
        inisialisasiPartikel();

        function animasiBackground() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            let gradasi = ctx.createRadialGradient(canvas.width/2, 0, 10, canvas.width/2, 0, canvas.height);
            gradasi.addColorStop(0, '#0a0923');
            gradasi.addColorStop(1, '#030712');
            ctx.fillStyle = gradasi;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < partikelArray.length; i++) {
                partikelArray[i].update();
                partikelArray[i].draw();
            }
            requestAnimationFrame(animasiBackground);
        }
        animasiBackground();

        // KAPSUL WAKTU CORE LOGIC
        const modalInput = document.getElementById('modal-input');
        const btnBukaModal = document.getElementById('btn-buka-modal');
        const btnBatal = document.getElementById('btn-batal');
        const btnSimpan = document.getElementById('btn-simpan');

        const inputJudul = document.getElementById('judul');
        const inputCerita = document.getElementById('cerita');
        const inputFoto = document.getElementById('foto');
        const previewContainer = document.getElementById('preview-container');
        const previewFoto = document.getElementById('preview-foto');
        const daftarMemoriDiv = document.getElementById('daftar-memori');
        const counterMomen = document.getElementById('counter-momen');

        let fotoBase64 = "";

        btnBukaModal.addEventListener('click', () => modalInput.classList.remove('hidden'));
        btnBatal.addEventListener('click', tutupModal);

        function tutupModal() {
            modalInput.classList.add('hidden');
            inputJudul.value = "";
            inputCerita.value = "";
            inputFoto.value = "";
            fotoBase64 = "";
            previewContainer.classList.add('hidden');
        }

        inputFoto.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewFoto.src = e.target.result;
                    fotoBase64 = e.target.result;
                    previewContainer.classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        });

        btnSimpan.addEventListener('click', function() {
            const judul = inputJudul.value.trim() || "Momen Spesial";
            const cerita = inputCerita.value.trim() || "Tidak ada catatan.";

            if (!fotoBase64) {
                alert("Silakan pilih foto terlebih dahulu!");
                return;
            }

            const opsiTanggal = { day: 'numeric', month: 'long', year: 'numeric' };
            const tanggalHariIni = new Date().toLocaleDateString('id-ID', opsiTanggal);

            let kumpulanMemori = JSON.parse(localStorage.getItem('kapsulWaktuGitHub')) || [];

            const memoriBaru = {
                id: +new Date(),
                judul: judul,
                cerita: cerita,
                tanggal: tanggalHariIni,
                foto: fotoBase64
            };

            kumpulanMemori.push(memoriBaru);
            localStorage.setItem('kapsulWaktuGitHub', JSON.stringify(kumpulanMemori));

            tutupModal();
            tampilkanMemori();
        });

        function tampilkanMemori() {
            daftarMemoriDiv.innerHTML = "";
            const kumpulanMemori = JSON.parse(localStorage.getItem('kapsulWaktuGitHub')) || [];

            if (kumpulanMemori.length === 0) {
                counterMomen.innerHTML = "✨ Kapsul Kosong";
                daftarMemoriDiv.innerHTML = `<p style="color:#6b7280; grid-column: 1/-1; text-align:center; margin-top:40px; font-size:14px;">Belum ada momen terkunci. Ayo abadikan foto memorimu hari ini!</p>`;
                return;
            } else {
                counterMomen.innerHTML = `🔮 ${kumpulanMemori.length} Momen Terkunci`;
            }

            [...kumpulanMemori].reverse().forEach(memori => {
                const card = document.createElement('div');
                card.classList.add('card-memori');
                card.innerHTML = `
                    <div class="image-wrapper">
                        <img src="${memori.foto}">
                    </div>
                    <div class="card-content">
                        <div class="card-date">${memori.tanggal}</div>
                        <h3>${memori.judul}</h3>
                        <p>${memori.cerita}</p>
                        <button class="btn-hapus" onclick="hapusMemori(${memori.id})">Hapus Momen</button>
                    </div>
                `;
                daftarMemoriDiv.appendChild(card);
            });
        }

        window.hapusMemori = function(id) {
            if(confirm("Apakah kamu yakin ingin menghapus kenangan ini?")) {
                let kumpulanMemori = JSON.parse(localStorage.getItem('kapsulWaktuGitHub')) || [];
                kumpulanMemori = kumpulanMemori.filter(m => m.id !== id);
                localStorage.setItem('kapsulWaktuGitHub', JSON.stringify(kumpulanMemori));
                tampilkanMemori();
            }
        }

        tampilkanMemori();
    </script>
</body>
</html>
